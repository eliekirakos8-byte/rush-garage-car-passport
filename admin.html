
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rush Garage | Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}
main{max-width:900px;margin:30px auto;padding:18px}
header{border-bottom:3px solid #e21b2d;padding:20px 0;text-align:center}
h1{color:#e21b2d;margin:0}
.card{background:#1c1c1c;border:1px solid #383838;border-radius:12px;padding:20px;margin:18px 0}
input,select,textarea,button{width:100%;padding:12px;margin:7px 0;border-radius:7px;font-size:16px}
input,select,textarea{background:#292929;color:white;border:1px solid #555}
button{background:#e21b2d;color:white;border:0;font-weight:bold;cursor:pointer}
.secondary{background:#333}
.hidden{display:none}
.msg{color:#ff7777;white-space:pre-wrap}
.item{border-bottom:1px solid #444;padding:12px 0;overflow-wrap:anywhere}
small{color:#bbb}
</style>
</head>
<body>
<main>
<header>
<h1>RUSH GARAGE</h1>
<p>Car Passport — لوحة الإدارة</p>
</header>

<section id="login" class="card">
<h3>تسجيل دخول الإدارة</h3>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button id="loginBtn">تسجيل الدخول</button>
<p id="loginMsg" class="msg"></p>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h3>إضافة سيارة</h3>
<input id="customer" placeholder="اسم الزبون">
<input id="make" placeholder="الشركة — Volkswagen">
<input id="model" placeholder="الموديل — Golf">
<input id="year" type="number" placeholder="سنة الصنع">
<input id="plate" placeholder="رقم اللوحة">
<input id="code" placeholder="كود الزبون الفريد">
<button id="addCar">حفظ السيارة</button>
<p id="carMsg" class="msg"></p>
</div>

<div class="card">
<h3>إضافة صيانة</h3>
<select id="carSelect">
<option value="">اختَر السيارة</option>
</select>
<input id="serviceType" placeholder="نوع الصيانة">
<textarea id="description" placeholder="تفاصيل الصيانة والقطع"></textarea>
<input id="serviceDate" type="date">
<button id="addService">حفظ الصيانة</button>
<p id="serviceMsg" class="msg"></p>
</div>

<div class="card">
<h3>السيارات المسجّلة</h3>
<button id="refresh" class="secondary">تحديث اللائحة</button>
<div id="carsList"></div>
</div>

<button id="logout" class="secondary">تسجيل الخروج</button>
</section>
</main>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = ''https://wcudutpmguznusjgsfpc.supabase.co'';
const SUPABASE_PUBLISHABLE_KEY = '_SUPABASE_PUBLISHABLE_KEY=sb_publishable_U7VVE70mueB9LaWMPRIeBQ_HeEJQSMg';

const $ = id => document.getElementById(id);
const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

function message(id, text) {
  $(id).textContent = text;
}

async function checkAdmin() {
  const { data: { session } } =
    await supabase.auth.getSession();

  let allowed = false;

  if (session) {
    const { data, error } = await supabase
      .from('mechanics')
      .select('role')
      .eq('user_id', session.user.id)
      .maybeSingle();

    allowed = !error && data?.role === 'admin';
  }

  $('login').classList.toggle('hidden', allowed);
  $('dashboard').classList.toggle('hidden', !allowed);

  if (session && !allowed) {
    await supabase.auth.signOut();
    message('loginMsg', 'هذا الحساب ليس لديه صلاحية الإدارة.');
  }

  if (allowed) await loadCars();
}

$('loginBtn').onclick = async () => {
  message('loginMsg', 'جارٍ تسجيل الدخول...');

  const email = $('email').value.trim();
  const password = $('password').value;

  if (!email || !password) {
    message('loginMsg', 'أدخل البريد الإلكتروني وكلمة المرور.');
    return;
  }

  const { error } = await supabase.auth.signInWithPassword({
    email, password
  });

  if (error) {
    message('loginMsg', 'فشل الدخول: ' + error.message);
    return;
  }

  await checkAdmin();
};

async function loadCars() {
  const { data, error } = await supabase
    .from('cars')
    .select('id,make,model,year,customer_name,plate_number,access_code')
    .order('make');

  if (error) {
    message('carsList', 'تعذّر تحميل السيارات: ' + error.message);
    return;
  }

  $('carSelect').innerHTML =
    '<option value="">اختَر السيارة</option>';

  $('carsList').innerHTML = '';

  for (const car of data || []) {
    const option = document.createElement('option');
    option.value = car.id;
    option.textContent =
      `${car.make} ${car.model} — ${car.customer_name || ''}`;
    $('carSelect').appendChild(option);

    const item = document.createElement('div');
    item.className = 'item';

    const title = document.createElement('b');
    title.textContent =
      `${car.make} ${car.model} (${car.year || '—'})`;

    const details = document.createElement('p');
    details.textContent =
      `الزبون: ${car.customer_name || '—'} | اللوحة: ${car.plate_number || '—'}`;

    const code = document.createElement('p');
    code.textContent = `كود الزبون: ${car.access_code}`;

    item.append(title, details, code);
    $('carsList').appendChild(item);
  }
}

$('addCar').onclick = async () => {
  const make = $('make').value.trim();
  const model = $('model').value.trim();
  const year = Number($('year').value);
  const customer_name = $('customer').value.trim();
  const plate_number = $('plate').value.trim();
  const access_code = $('code').value.trim();

  if (!make || !model || !access_code) {
    message('carMsg', 'أدخل الشركة والموديل وكود الزبون.');
    return;
  }

  const { error } = await supabase.from('cars').insert([{
    make, model,
    year: year || null,
    customer_name: customer_name || null,
    plate_number: plate_number || null,
    access_code
  }]);

  if (error) {
    message('carMsg', 'تعذّرت إضافة السيارة: ' + error.message);
    return;
  }

  message('carMsg', 'تمت إضافة السيارة بنجاح.');
  for (const id of ['customer','make','model','year','plate','code']) {
    $(id).value = '';
  }
  await loadCars();
};

$('addService').onclick = async () => {
  const car_id = $('carSelect').value;
  const service_type = $('serviceType').value.trim();
  const description = $('description').value.trim();
  const service_date = $('serviceDate').value ||
    new Date().toISOString().slice(0, 10);

  if (!car_id || !service_type) {
    message('serviceMsg', 'اختَر سيارة وأدخل نوع الصيانة.');
    return;
  }

  const { error } = await supabase
    .from('service_records')
    .insert([{
      car_id,
      service_type,
      description,
      service_date
    }]);

  if (error) {
    message('serviceMsg', 'تعذّرت إضافة الصيانة: ' + error.message);
    return;
  }

  message('serviceMsg', 'تم حفظ الصيانة.');
  $('serviceType').value = '';
  $('description').value = '';
};

$('refresh').onclick = loadCars;

$('logout').onclick = async () => {
  await supabase.auth.signOut();
  $('dashboard').classList.add('hidden');
  $('login').classList.remove('hidden');
};

supabase.auth.onAuthStateChange(() => {
  setTimeout(checkAdmin, 0);
});

checkAdmin();
</script>
</body>
</html>
