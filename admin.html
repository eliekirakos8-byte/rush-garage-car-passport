
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rush Garage | Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px;
      background: #101010; color: white;
      font-family: Arial, sans-serif;
    }
    main { max-width: 760px; margin: 20px auto; }
    header {
      text-align: center; padding: 16px;
      border-bottom: 3px solid #e21b2d;
    }
    h1, h2 { color: #ed2538; }
    .card {
      background: #1c1c1c; padding: 20px;
      border-radius: 12px; margin: 18px 0;
      border: 1px solid #333;
    }
    input, select, textarea, button {
      width: 100%; padding: 13px; margin: 7px 0;
      border-radius: 7px; font-size: 16px;
    }
    input, select, textarea {
      background: #292929; border: 1px solid #555;
      color: white;
    }
    button {
      background: #e21b2d; color: white;
      border: 0; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .secondary { background: #444; }
    .hidden { display: none !important; }
    .note { color: #ccc; line-height: 1.7; }
    #msg, #loginMsg {
      white-space: pre-wrap; line-height: 1.7;
      overflow-wrap: anywhere;
    }
    .item {
      padding: 12px; margin: 10px 0;
      background: #292929; border-radius: 8px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>RUSH GARAGE</h1>
    <p>لوحة إدارة السيارات والصيانة</p>
    <p>Car Passport</p>
  </header>

  <section class="card" id="login">
    <h2>تسجيل دخول الإدارة</h2>
    <p class="note">سجّل الدخول بحساب الإدارة المسجّل في Supabase.</p>
    <form id="loginForm">
      <input id="email" type="email"
        placeholder="البريد الإلكتروني" autocomplete="username" required>
      <input id="password" type="password"
        placeholder="كلمة المرور" autocomplete="current-password" required>
      <button id="loginBtn" type="submit">تسجيل الدخول</button>
    </form>
    <p id="loginMsg" role="status"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="card">
      <h2>إضافة سيارة جديدة</h2>
      <form id="carForm">
        <input id="make" placeholder="ماركة السيارة — Volkswagen" required>
        <input id="model" placeholder="الموديل — Golf / Tiguan" required>
        <input id="year" type="number" min="1900" max="2100"
          placeholder="سنة الصنع">
        <input id="customer" placeholder="اسم الزبون">
        <input id="plate" placeholder="رقم اللوحة">
        <input id="code" placeholder="كود فريد للزبون — RG-2026-001"
          required minlength="6">
        <button id="addCar" type="submit">حفظ السيارة</button>
      </form>
      <p id="carMsg" role="status"></p>
    </div>

    <div class="card">
      <h2>إضافة سجل صيانة</h2>
      <form id="serviceForm">
        <label for="carSelect">اختَر السيارة</label>
        <select id="carSelect" required>
          <option value="">حمّل السيارات أولاً</option>
        </select>
        <input id="serviceType" placeholder="نوع الصيانة" required>
        <textarea id="description" placeholder="تفاصيل الصيانة"></textarea>
        <input id="partsUsed" placeholder="قطع الغيار المستخدمة">
        <input id="serviceDate" type="date">
        <input id="laborCost" type="number" min="0" step="0.01"
          placeholder="كلفة اليد العاملة">
        <input id="partsCost" type="number" min="0" step="0.01"
          placeholder="كلفة قطع الغيار">
        <textarea id="notes" placeholder="ملاحظات إضافية"></textarea>
        <button id="addService" type="submit">حفظ الصيانة</button>
      </form>
      <p id="serviceMsg" role="status"></p>
    </div>


<div class="card">
  <h2>السيارات المسجّلة</h2>
  <button id="refresh" type="button" class="secondary">
    تحديث قائمة السيارات
  </button>
  <div id="carsList"></div>
</div>

<div class="card">
  <h2>إضافة قطعة سيارة</h2>
  <form id="partForm">
    <input id="partName" placeholder="اسم القطعة" required>
    <input id="partNumber" placeholder="رقم القطعة">
    <input id="partCars" placeholder="السيارات المناسبة">
    <input id="partPrice" type="number" min="0" step="0.01" placeholder="السعر">
    <textarea id="partDescription" placeholder="تفاصيل القطعة"></textarea>
    <label for="partImage">صورة القطعة</label>
    <input id="partImage" type="file" accept="image/*" required>
    <button id="addPart" type="submit">حفظ القطعة</button>
  </form>
  <p id="partMsg" role="status"></p>
  <div id="partsList"></div>
</div>

<button id="logout" type="button" class="secondary">
  تسجيل الخروج
</button>
</section>

</main>

<script type="module">
import { createClient } from
  'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL =
  'https://wcudutpmguznusjgsfpc.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_U7VVE70mueB9LaWMPRIeBQ_HeEJQSMg';

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const $ = id => document.getElementById(id);

function message(id, text) {
  $(id).textContent = text;
}

let busy = false;

async function checkAdmin() {
  const { data: { session }, error: sessionError } =
    await supabase.auth.getSession();

  if (sessionError) {
    message('loginMsg', 'تعذّر التحقق من الجلسة: ' + sessionError.message);
    return;
  }

  if (!session) {
    $('login').classList.remove('hidden');
    $('dashboard').classList.add('hidden');
    return;
  }

  const { data, error } = await supabase
    .from('mechanics')
    .select('role')
    .eq('user_id', session.user.id)
    .maybeSingle();

  if (error || data?.role !== 'admin') {
    $('dashboard').classList.add('hidden');
    $('login').classList.remove('hidden');

    await supabase.auth.signOut();

    message(
      'loginMsg',
      error
        ? 'تعذّر التحقق من صلاحية الإدارة: ' + error.message
        : 'هذا الحساب ليس لديه صلاحية الإدارة.'
    );
    return;
  }

  $('login').classList.add('hidden');
  $('dashboard').classList.remove('hidden');
  message('loginMsg', '');

await loadCars();
await loadParts();
}

$('loginForm').addEventListener('submit', async event => {
  event.preventDefault();
  if (busy) return;
  busy = true;
  $('loginBtn').disabled = true;
  message('loginMsg', 'جارٍ تسجيل الدخول...');

  try {
    const email = $('email').value.trim();
    const password = $('password').value;

    const { error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      message('loginMsg', 'فشل الدخول: ' + error.message);
      return;
    }

    await checkAdmin();
  } catch (error) {
    message('loginMsg', 'حدث خطأ: ' + error.message);
  } finally {
    busy = false;
    $('loginBtn').disabled = false;
  }
});

async function loadCars() {
  message('carMsg', 'جارٍ تحميل السيارات...');
  $('carsList').innerHTML = '';

  const { data, error } = await supabase
    .from('cars')
    .select('id,make,model,year,customer_name,plate_number,access_code')
    .order('make');

  if (error) {
    message('carMsg', 'تعذّر تحميل السيارات: ' + error.message);
    return;
  }

  const select = $('carSelect');
  select.innerHTML = '<option value="">اختَر السيارة</option>';

  for (const car of data || []) {
    const option = document.createElement('option');
    option.value = car.id;
    option.textContent =
      `${car.make} ${car.model} — ${car.customer_name || 'بدون اسم'} — ${car.access_code}`;
    select.appendChild(option);

    const item = document.createElement('div');
    item.className = 'item';

    const title = document.createElement('strong');
    title.textContent =
      `${car.make} ${car.model} (${car.year || '—'})`;

    const details = document.createElement('p');
    details.textContent =
      `الزبون: ${car.customer_name || '—'} | اللوحة: ${car.plate_number || '—'}`;

    const code = document.createElement('p');
    code.textContent = 'كود الزبون: ' + car.access_code;

    item.append(title, details, code);
    $('carsList').appendChild(item);
  }

  message('carMsg', `عدد السيارات: ${(data || []).length}`);
}

$('carForm').addEventListener('submit', async event => {
  event.preventDefault();

  const make = $('make').value.trim();
  const model = $('model').value.trim();
  const yearValue = $('year').value;
  const customer_name = $('customer').value.trim();
  const plate_number = $('plate').value.trim();
  const access_code = $('code').value.trim();

  if (!make || !model || !access_code) {
    message('carMsg', 'أدخل الماركة والموديل وكود السيارة.');
    return;
  }

  const car = {
    make,
    model,
    year: yearValue ? Number(yearValue) : null,
    customer_name: customer_name || null,
    plate_number: plate_number || null,
    access_code
  };

  $('addCar').disabled = true;
  message('carMsg', 'جارٍ حفظ السيارة...');

  try {
    const { error } = await supabase.from('cars').insert([car]);

    if (error) {
      message('carMsg', 'تعذّرت إضافة السيارة: ' + error.message);
      return;
    }

    message('carMsg', 'تمت إضافة السيارة بنجاح.');
    $('carForm').reset();
    await loadCars();
  } catch (error) {
    message('carMsg', 'حدث خطأ: ' + error.message);
  } finally {
    $('addCar').disabled = false;
  }
});

$('serviceForm').addEventListener('submit', async event => {
  event.preventDefault();

  const car_id = $('carSelect').value;
  const service_type = $('serviceType').value.trim();
  const description = $('description').value.trim();
  const parts_used = $('partsUsed').value.trim();
  const service_date = $('serviceDate').value;
  const labor = $('laborCost').value;
  const parts = $('partsCost').value;
  const notes = $('notes').value.trim();

  if (!car_id || !service_type) {
    message('serviceMsg', 'اختَر السيارة وأدخل نوع الصيانة.');
    return;
  }

  const record = {
    car_id,
    service_type,
    description: description || null,
    parts_used: parts_used || null,
    notes: notes || null
  };

  if (service_date) record.service_date = service_date;
  if (labor !== '') record.labor_cost = Number(labor);
  if (parts !== '') record.parts_cost = Number(parts);

  $('addService').disabled = true;
  message('serviceMsg', 'جارٍ حفظ الصيانة...');

  try {
    const { error } = await supabase
      .from('service_records')
      .insert([record]);

    if (error) {
      message('serviceMsg', 'تعذّر حفظ الصيانة: ' + error.message);
      return;
    }

    message('serviceMsg', 'تم حفظ سجل الصيانة بنجاح.');
    $('serviceForm').reset();
    await loadCars();
    await loadParts();
  } catch (error) {
    message('serviceMsg', 'حدث خطأ: ' + error.message);
  } finally {
    $('addService').disabled = false;
  }
});

$('refresh').addEventListener('click', loadCars);

$('logout').addEventListener('click', async () => {
  const { error } = await supabase.auth.signOut();

  if (error) {
    message('loginMsg', 'تعذّر تسجيل الخروج: ' + error.message);
    return;
  }

  $('dashboard').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('password').value = '';
  message('loginMsg', 'تم تسجيل الخروج.');
});

supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') {
    $('dashboard').classList.add('hidden');
    $('login').classList.remove('hidden');
  }
});

async function loadParts() {
  const list = $('partsList');
  list.replaceChildren();

  const { data, error } = await supabase
    .from('parts')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    message('partMsg', 'تعذّر تحميل القطع: ' + error.message);
    return;
  }

  for (const part of data || []) {
    const item = document.createElement('div');
    item.className = 'item';

    if (part.image_url) {
      const img = document.createElement('img');
      img.src = part.image_url;
      img.alt = part.name;
      img.style.width = '100%';
      img.style.maxWidth = '260px';
      img.style.borderRadius = '8px';
      item.appendChild(img);
    }

    const title = document.createElement('strong');
    title.textContent = part.name;
    item.appendChild(title);

    const details = document.createElement('p');
    details.textContent =
      'رقم القطعة: ' + (part.part_number || '-') +
      ' | السيارات: ' + (part.compatible_cars || '-') +
      ' | السعر: ' + (part.price ?? '-');
    item.appendChild(details);

    const del = document.createElement('button');
    del.type = 'button';
    del.textContent = 'حذف القطعة';
    del.className = 'secondary';

    del.addEventListener('click', async () => {
      if (!confirm('هل تريد حذف هذه القطعة؟')) return;

      const { error: deleteError } = await supabase
        .from('parts')
        .delete()
        .eq('id', part.id);

      if (deleteError) {
        message('partMsg', 'تعذّر الحذف: ' + deleteError.message);
        return;
      }

      if (part.image_url) {
        const marker = '/storage/v1/object/public/parts-images/';
        const pos = part.image_url.indexOf(marker);

        if (pos !== -1) {
          const path = decodeURIComponent(
            part.image_url.slice(pos + marker.length)
          );

          await supabase.storage.from('parts-images').remove([path]);
        }
      }

      message('partMsg', 'تم حذف القطعة.');
      await loadParts();
    });

    item.appendChild(del);
    list.appendChild(item);
  }
}

$('partForm').addEventListener('submit', async event => {
  event.preventDefault();

  const button = $('addPart');
  const file = $('partImage').files[0];
  const name = $('partName').value.trim();

  if (!name || !file) {
    message('partMsg', 'أدخل اسم القطعة واختر صورتها.');
    return;
  }

  if (!file.type.startsWith('image/')) {
    message('partMsg', 'الملف المختار يجب أن يكون صورة.');
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    message('partMsg', 'حجم الصورة يجب ألا يتجاوز 5 MB.');
    return;
  }

  button.disabled = true;
  message('partMsg', 'جارٍ رفع الصورة وحفظ القطعة...');

  let uploadedPath = null;

  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = Date.now() + '-' + safeName;

    const { error: uploadError } = await supabase.storage
      .from('parts-images')
      .upload(path, file, { upsert: false });

    if (uploadError) throw uploadError;
    uploadedPath = path;

    const { data: urlData } = supabase.storage
      .from('parts-images')
      .getPublicUrl(path);

    const priceValue = $('partPrice').value;

    const { error: insertError } = await supabase.from('parts').insert([{
      name,
      part_number: $('partNumber').value.trim() || null,
      compatible_cars: $('partCars').value.trim() || null,
      price: priceValue === '' ? null : Number(priceValue),
      description: $('partDescription').value.trim() || null,
      image_url: urlData.publicUrl,
      is_active: true
    }]);

    if (insertError) throw insertError;

    $('partForm').reset();
    message('partMsg', 'تمت إضافة القطعة بنجاح.');
    await loadParts();
  } catch (error) {
    if (uploadedPath) {
      await supabase.storage.from('parts-images').remove([uploadedPath]);
    }

    message('partMsg', 'تعذّرت إضافة القطعة: ' + error.message);
  } finally {
    button.disabled = false;
  }
});
            
checkAdmin().catch(error => {
  message('loginMsg', 'تعذّر تشغيل الصفحة: ' + error.message);
});
</script>
</body>
</html>
